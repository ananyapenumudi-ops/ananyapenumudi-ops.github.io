<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost? · Ananya Penumudi</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=DM+Sans:wght@500;700&family=Shrikhand&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100svh; display: grid; place-items: center; background: #f3e9d6; color: #1b1b1b; font-family: 'DM Sans', system-ui, sans-serif; padding: 24px; text-align: center; }
    body::before { content: ''; position: fixed; left: 0; right: 0; top: 0; height: 6px; background: #d81e2c; }
    .card { max-width: 520px; }
    img { width: 190px; height: 238px; object-fit: cover; border: 3px solid #1b1b1b; border-radius: 8px; box-shadow: 8px 8px 0 #d81e2c; transform: rotate(-4deg); }
    h1 { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; color: #d81e2c; font-size: clamp(80px, 22vw, 150px); line-height: .85; margin-top: 28px; }
    h2 { font-family: 'Shrikhand', serif; font-weight: 400; font-size: clamp(22px, 5vw, 30px); margin-top: 8px; }
    p { margin-top: 12px; color: #4b4339; font-size: 17px; }
    a { display: inline-block; margin-top: 24px; padding: 12px 24px; border: 2px solid #1b1b1b; border-radius: 999px; background: #d81e2c; color: #fdf6ea; font-weight: 700; text-decoration: none; }
    a:hover { box-shadow: 4px 4px 0 #1b1b1b; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/art/duck.svg" alt="A duck looking a little confused" />
    <h1>404</h1>
    <h2>This page wandered off</h2>
    <p>Even the duck couldn't find it. Let's get you back to the good stuff.</p>
    <a href="/">Back to the portfolio</a>
  </div>
</body>
</html>
