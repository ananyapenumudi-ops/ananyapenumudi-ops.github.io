<!doctype html>
<!-- Source for public/og.png (link preview image).
     Regenerate: chrome --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1200,630 --screenshot=public/og.png scripts/og.html -->
<html>
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=DM+Sans:wght@500;700&family=Shrikhand&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f3e9d6; font-family: 'DM Sans', sans-serif; color: #1b1b1b; position: relative; }
  body::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: #d81e2c; }
  .text { position: absolute; left: 72px; top: 92px; width: 600px; }
  .hello { font-family: 'Shrikhand', serif; font-size: 40px; color: #2f6b6b; }
  .name { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 196px; line-height: 0.82; color: #d81e2c; margin-top: 10px; }
  .sur { font-family: 'Shrikhand', serif; font-size: 62px; margin-top: 10px; }
  .tag { margin-top: 26px; font-size: 27px; font-weight: 500; line-height: 1.35; }
  .tag b { color: #d81e2c; }
  .url { position: absolute; left: 72px; bottom: 56px; font-size: 24px; font-weight: 700; border: 3px solid #1b1b1b; border-radius: 999px; padding: 10px 26px; background: #f2b632; }
  .tile { position: absolute; width: 230px; height: 288px; border: 4px solid #1b1b1b; border-radius: 10px; overflow: hidden; box-shadow: 10px 10px 0 #1b1b1b; }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .t1 { left: 690px; top: 70px; transform: rotate(-6deg); }
  .t2 { left: 930px; top: 40px; transform: rotate(5deg); }
  .t3 { left: 820px; top: 300px; transform: rotate(3deg); z-index: 2; }
</style>
</head>
<body>
  <div class="text">
    <div class="hello">hi there, I'm</div>
    <div class="name">ANANYA</div>
    <div class="sur">Penumudi</div>
    <p class="tag">B.Tech CSE (IoT) · <b>embedded systems</b>, edge AI &amp; safety-critical design</p>
  </div>
  <div class="url">ananyapenumudi-ops.github.io</div>
  <div class="tile t1"><img src="../public/art/train.svg" /></div>
  <div class="tile t2"><img src="../public/art/flask.svg" /></div>
  <div class="tile t3"><img src="../public/art/duck.svg" /></div>
</body>
</html>
